<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://retocker.web.app">
<title>SYTER</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #91a0b7; font: 600 15px system-ui, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; }
  .sub { opacity: .6; font-weight: 400; margin-top: 6px; }
  button { margin-top: 22px; background: #0d0f14; color: #fff; border: 1px solid #2a2f3a; border-radius: 10px; padding: 9px 20px; font: inherit; cursor: pointer; transition: border-color .2s; }
  button:hover { border-color: rgba(255,255,255,.3); }
</style>
</head>
<body>
<div>
  <div>No internet connection</div>
  <div class="sub">The journal will open when you are back online.</div>
  <button id="retry">Retry</button>
</div>
<script>
(function () {
  'use strict';
  var APP_URL = 'https://retocker.web.app/';
  // navigator.onLine is also true on a network without internet access, so the
  // journal is opened only after the site really answers. Probes back off.
  var DELAYS = [10000, 20000, 40000, 60000], PROBE_TIMEOUT = 8000;
  var attempt = 0, timer = null, probing = false, leaving = false;
  function go() { leaving = true; clearTimeout(timer); location.href = APP_URL; }
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(probe, DELAYS[Math.min(attempt++, DELAYS.length - 1)]);
  }
  function probe() {
    if (probing || leaving) return;
    probing = true; clearTimeout(timer);
    var controller = typeof AbortController === 'function' ? new AbortController() : null;
    var abort = setTimeout(function () { if (controller) controller.abort(); }, PROBE_TIMEOUT);
    fetch(APP_URL + '?syter-probe=' + Date.now(), { method: 'HEAD', mode: 'no-cors', cache: 'no-store',
      credentials: 'omit', signal: controller ? controller.signal : undefined })
      .then(function () { clearTimeout(abort); probing = false; go(); },
        function () { clearTimeout(abort); probing = false; if (!leaving) schedule(); });
  }
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', function () { attempt = 0; probe(); });
  schedule();
})();
</script>
</body>
</html>
