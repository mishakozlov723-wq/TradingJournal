name: Repair replay asset fingerprint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-replay-fingerprint.yml']
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'ci: refresh replay asset fingerprint' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh fingerprint and remove bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          old = 'replay-space.js?v=3f01a35691'
          new = 'replay-space.js?v=bf3e3ab56a'
          if old not in s:
              raise SystemExit(f'expected fingerprint not found: {old}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-replay-fingerprint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html .github/workflows/fix-replay-fingerprint.yml
          git commit -m 'ci: refresh replay asset fingerprint'
          git push