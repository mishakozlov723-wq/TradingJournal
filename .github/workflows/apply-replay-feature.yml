name: Apply prepared Replay feature

on:
  push:
    branches:
      - feature/replay-timeframe-input

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply and commit feature
        run: |
          git apply --index replay-feature.patch
          git rm .github/workflows/apply-replay-feature.yml replay-feature.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add TradingView-style replay timeframe input'
          git push origin "HEAD:${GITHUB_REF_NAME}"
