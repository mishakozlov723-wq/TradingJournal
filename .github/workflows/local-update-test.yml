name: Verify private local SYTER update test
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: syter-local-update-test
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Fetch exact built payload and verified baseline without rebuilding
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            for (const [id,name] of [[11977522018,'payload.zip'],[11974956463,'baseline.zip']]) {
              const r = await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:id,archive_format:'zip'});
              fs.writeFileSync('desktop/'+name,Buffer.from(r.data));
            }
      - name: Prepare local test pack and verify scripts
        run: |
          if ((Get-FileHash payload.zip -Algorithm SHA256).Hash.ToLower() -ne '2533bf5f4c318d3940f15a40aed0a76162deef77a1f4752f0af9b1887782bae3') { throw 'Payload digest mismatch' }
          if ((Get-FileHash baseline.zip -Algorithm SHA256).Hash.ToLower() -ne '97d536615a6dd3a8654b2d4d6d14b4bda8b2c5eca7b4917854b94215913f09f7') { throw 'Baseline digest mismatch' }
          & 'C:/Program Files/7-Zip/7z.exe' x payload.zip -orelease -y
          if ($LASTEXITCODE -ne 0) { throw 'Payload extraction failed' }
          & 'C:/Program Files/7-Zip/7z.exe' x baseline.zip SYTER-Setup-1.3.6.exe -obaseline -y
          if ($LASTEXITCODE -ne 0) { throw 'Baseline extraction failed' }
          node update-test/package-test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          & powershell.exe -NoProfile -Command '$tokens=$null; $errors=$null; [Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./update-test-pack/verify-update.ps1),[ref]$tokens,[ref]$errors)|Out-Null; if ($errors.Count) { $errors; exit 1 }'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell parser failed' }
      - name: Verify real installed update end to end
        run: |
          $p=Start-Process (Resolve-Path baseline/SYTER-Setup-1.3.6.exe).Path -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Baseline install failed' }
          Get-Process SYTER -ErrorAction SilentlyContinue|Stop-Process -Force
          New-Item "$env:APPDATA/syter-desktop" -ItemType Directory -Force|Out-Null
          'preserve-local-update-test'|Set-Content "$env:APPDATA/syter-desktop/local-update-sentinel.txt"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./update-test-pack/Test-Update.ps1 -Automation
          if ($LASTEXITCODE -ne 0) { throw 'Installed updater test failed' }
          if ((Get-Content "$env:APPDATA/syter-desktop/local-update-sentinel.txt" -Raw).Trim() -ne 'preserve-local-update-test') { throw 'Profile sentinel lost' }
          if (Test-Path update-test-pack/test-session.json) { throw 'Test source was not cleaned up' }
          'PASS: installed app restarted on 1.3.7, updater restored, profile sentinel preserved'|Set-Content test-artifacts/local-update-result.txt
          Remove-Item update-test-pack/verify-update.ps1
      - name: Save actual update frames and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-local-update-inspection
          path: |
            desktop/test-artifacts/local-update-*
            desktop/update-test-pack/requests.log
          retention-days: 14
          if-no-files-found: warn
      - name: Save private user test pack
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-local-update-test-1.3.6-to-1.3.7
          path: |
            desktop/update-test-pack/START-TEST.cmd
            desktop/update-test-pack/RESTORE-NORMAL-UPDATES.cmd
            desktop/update-test-pack/Test-Update.ps1
            desktop/update-test-pack/README.txt
            desktop/update-test-pack/test-manifest.json
            desktop/update-test-pack/latest.yml
            desktop/update-test-pack/SYTER-Setup-1.3.7.exe
            desktop/update-test-pack/SYTER-Setup-1.3.7.exe.blockmap
          retention-days: 14
          if-no-files-found: error
