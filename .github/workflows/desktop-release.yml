name: Verify and build SYTER desktop

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Optional trusted Authenticode signing; false preserves existing GitHub auto-updates without paid signing
        type: boolean
        default: false
      notes_only:
        description: Focus checks on update notes and scrollbar styling; no mini animation or installer redesign checks
        type: boolean
        default: false
      reuse_verified_update:
        description: Reuse the verified 1.3.7 update payload; only build the native wrapper
        type: boolean
        default: false
      local_update_test:
        description: Build a private local 1.3.6 to 1.3.7 update test instead of a release
        type: boolean
        default: false
      publish:
        description: Publish the verified installer to syter-releases
        type: boolean
        default: false
      installer_only:
        description: Build installer and test its transitions, installation and launch only
        type: boolean
        default: false
      check_only:
        description: Run regression and native transition checks without building an installer
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: syter-desktop-release
  cancel-in-progress: false

jobs:
  local-update:
    if: ${{ inputs.local_update_test }}
    uses: ./.github/workflows/local-update-test.yml
  windows:
    permissions:
      contents: write
      actions: read
    if: ${{ !inputs.local_update_test }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Reject incomplete publication checks
        run: |
          if ('${{ inputs.publish }}' -eq 'true' -and ('${{ github.ref }}' -ne 'refs/heads/main' -or '${{ inputs.notes_only }}' -eq 'true' -or '${{ inputs.installer_only }}' -eq 'true' -or '${{ inputs.reuse_verified_update }}' -eq 'true' -or '${{ inputs.check_only }}' -eq 'true')) { throw 'Publishing requires main and every full verification gate; reduced or reused builds cannot publish' }
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked desktop dependencies and Electron runtime
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          # Newer Electron packages download their binary on first require,
          # rather than during npm ci. Resolve it before native test paths.
          node -e "console.log('Electron executable:', require('electron'))"
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime installation failed' }
      - name: Prepare native icon resources
        run: ./scripts/prepare-build-assets.ps1
      - name: Run relevant regression tests
        run: |
          if ('${{ inputs.notes_only }}' -eq 'true') { node --test tests/update-notes.test.cjs }
          else { npm test }
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Verify resize animation continuity and draft preservation
        if: ${{ !inputs.installer_only && !inputs.notes_only }}
        run: |
          $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
          $script = (Resolve-Path ./tests/resize-performance.native.cjs).Path
          $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput resize-test.log -RedirectStandardError resize-test-error.log
          Get-Content resize-test.log
          Get-Content resize-test-error.log
          if ($test.ExitCode -ne 0) { throw "Live resize test failed: $($test.ExitCode)" }
      - name: Measure 1.3.10 preparation on this same Windows runner
        if: ${{ !inputs.installer_only && !inputs.notes_only }}
        run: |
          git fetch --no-tags --depth=1 origin d4b69b90a881f6e1c92899c9bf42743c9a98bf78
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch exact 1.3.10 timing baseline' }
          $files = @('window-motion.js','mode-transition.js')
          try {
            foreach ($file in $files) {
              Copy-Item $file "$file.optimized"
              $old = git show "d4b69b90a881f6e1c92899c9bf42743c9a98bf78:desktop/$file"
              if ($LASTEXITCODE -ne 0) { throw "Baseline source unavailable: $file" }
              [IO.File]::WriteAllText((Join-Path $PWD $file), ($old -join "`n"), [Text.UTF8Encoding]::new($false))
            }
            $env:SYTER_TIMING_BASELINE = '1'
            $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
            $script = (Resolve-Path ./tests/user-release.native.cjs).Path
            $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput baseline-test.log -RedirectStandardError baseline-test-error.log
            Get-Content baseline-test.log
            Get-Content baseline-test-error.log
            if ($test.ExitCode -ne 0) { throw "Baseline test failed: $($test.ExitCode)" }
          } finally {
            Remove-Item Env:SYTER_TIMING_BASELINE -ErrorAction SilentlyContinue
            foreach ($file in $files) { if (Test-Path "$file.optimized") { Move-Item -Force "$file.optimized" $file } }
          }
      - name: Verify actual Windows app and global shortcut
        if: ${{ !inputs.installer_only && !inputs.notes_only }}
        run: |
          $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
          $script = (Resolve-Path ./tests/user-release.native.cjs).Path
          $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput native-test.log -RedirectStandardError native-test-error.log
          Get-Content native-test.log
          Get-Content native-test-error.log
          if ($test.ExitCode -ne 0) { throw "Native Electron test failed: $($test.ExitCode)" }
      - name: Verify branded updater windows and consent
        if: ${{ !inputs.installer_only }}
        run: |
          $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
          $script = (Resolve-Path ./tests/lifecycle.native.cjs).Path
          $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput lifecycle-test.log -RedirectStandardError lifecycle-test-error.log
          Get-Content lifecycle-test.log
          Get-Content lifecycle-test-error.log
          if ($test.ExitCode -ne 0) { throw "Lifecycle test failed: $($test.ExitCode)" }
          if (!(Select-String -Path lifecycle-test.log -Pattern "PASS: isolated native lifecycle windows" -Quiet)) { throw "Lifecycle test did not reach completion" }
      - name: Save native transition inspection frames
        # Optional diagnostic PNG export; native test failures and final EXE export remain blocking.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-transition-inspection
          path: desktop/test-artifacts/*
          if-no-files-found: warn
          retention-days: 7
      - name: Build installer and updater files
        if: ${{ !inputs.check_only && !inputs.reuse_verified_update }}
        env:
          SYTER_SIGNED_RELEASE: ${{ inputs.signed_release }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.SYTER_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SYTER_CSC_KEY_PASSWORD }}
          SYTER_PUBLISHER_NAME: ${{ vars.SYTER_PUBLISHER_NAME }}
        run: npm run build
      - name: Fetch exact verified 1.3.7 updater payload
        if: ${{ !inputs.check_only && inputs.reuse_verified_update }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const source = 'f660c2af3a6b1b0d1c7a3dd80533af88a9e789fe';
            const diff = await github.rest.repos.compareCommits({owner:context.repo.owner,repo:context.repo.repo,base:source,head:context.sha});
            for (const f of diff.data.files || []) {
              if (!f.filename.startsWith('.github/workflows/') && !f.filename.startsWith('desktop/update-test/') && !['desktop/package.json','desktop/package-lock.json','desktop/tests/user-release.test.cjs'].includes(f.filename)) {
                throw Error('Packaged source changed since the tested payload: '+f.filename);
              }
            }
            const r = await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:11977522018,archive_format:'zip'});
            fs.writeFileSync('desktop/verified-updater.zip',Buffer.from(r.data));
      - name: Wrap verified updater in the approved native installer
        if: ${{ !inputs.check_only && inputs.reuse_verified_update }}
        run: |
          if ((Get-Content package.json -Raw|ConvertFrom-Json).version -ne '1.3.7') { throw 'Verified payload only supports version 1.3.7' }
          if ((Get-FileHash verified-updater.zip -Algorithm SHA256).Hash.ToLower() -ne '2533bf5f4c318d3940f15a40aed0a76162deef77a1f4752f0af9b1887782bae3') { throw 'Verified artifact digest mismatch' }
          & 'C:/Program Files/7-Zip/7z.exe' x verified-updater.zip -orelease -y
          if ($LASTEXITCODE -ne 0) { throw 'Verified updater extraction failed' }
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item release/SYTER-Setup-1.3.7.exe dist/SYTER-Setup-1.3.7.exe
          node scripts/build-branded-installer.js
          if ($LASTEXITCODE -ne 0) { throw 'Native wrapper build failed' }
      - name: Verify visible generated and packaged icons
        if: ${{ !inputs.check_only && !inputs.installer_only && !inputs.notes_only }}
        run: |
          $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
          $script = (Resolve-Path ./tests/icons.native.cjs).Path
          $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput icon-test.log -RedirectStandardError icon-test-error.log
          Get-Content icon-test.log
          Get-Content icon-test-error.log
          if ($test.ExitCode -ne 0) { throw "Packaged icon test failed: $($test.ExitCode)" }
      - name: Save verified icon previews
        # Optional diagnostic PNG export; native test failures and final EXE export remain blocking.
        continue-on-error: true
        if: ${{ always() && !inputs.check_only && !inputs.notes_only }}
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-icon-inspection
          path: desktop/test-artifacts/*icon*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Download previous test installer for same-runner startup comparison
        if: ${{ !inputs.check_only && !inputs.installer_only && !inputs.notes_only }}
        uses: actions/download-artifact@v4
        with:
          name: SYTER-windows-release
          run-id: 38718005829
          github-token: ${{ github.token }}
          path: desktop/baseline
      - name: Verify delivered branded installer EXE
        if: ${{ !inputs.check_only && !inputs.notes_only }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/native-installer.ps1 -SkipBenchmark:('${{ inputs.installer_only }}' -eq 'true')
          if (!(Test-Path test-artifacts/native-installer-success.txt)) { throw 'Native installer verification did not complete' }
      - name: Verify native installer typography, keyboard focus and waiting animation
        if: ${{ !inputs.check_only && !inputs.notes_only }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $arguments = '-NoProfile -Sta -ExecutionPolicy Bypass -File ./tests/native-installer-ui.ps1 -InstallerPath "release/SYTER-Install-' + $version + '.exe"'
          $test = Start-Process powershell.exe -ArgumentList $arguments -PassThru -RedirectStandardOutput test-artifacts/native-installer-ui-test.log -RedirectStandardError test-artifacts/native-installer-ui-test-error.log
          try {
            if (!$test.WaitForExit(60000)) { Stop-Process -Id $test.Id -Force; throw 'Native UI checks timed out' }
            if ($test.ExitCode -ne 0) { throw "Native installer UI verification failed: exit $($test.ExitCode)" }
            if (!(Test-Path test-artifacts/native-installer-ui-success.txt)) { throw 'Native UI checks did not finish' }
          } finally {
            Get-Content test-artifacts/native-installer-ui-test.log
            Get-Content test-artifacts/native-installer-ui-test-error.log
          }
      - name: Verify real installed 1.3.12 to 1.3.13 update with private loopback feed
        if: ${{ !inputs.check_only && !inputs.installer_only && !inputs.notes_only && !inputs.reuse_verified_update }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -eq '1.3.13') {
            New-Item baseline -ItemType Directory -Force | Out-Null
            Invoke-WebRequest 'https://github.com/mishakozlov723-wq/syter-releases/releases/download/v1.3.12/SYTER-Setup-1.3.12.exe' -OutFile baseline/SYTER-Setup-1.3.12.exe
            if ((Get-FileHash baseline/SYTER-Setup-1.3.12.exe -Algorithm SHA256).Hash.ToLower() -ne 'c0a6b61d9bbcbb1e5cc8e20b014cd7993164c85bf82789639c968cc49bd6ca3f') { throw 'Published 1.3.12 baseline digest mismatch' }
            Get-Process SYTER -ErrorAction SilentlyContinue | Stop-Process -Force
            $p=Start-Process (Resolve-Path baseline/SYTER-Setup-1.3.12.exe).Path -ArgumentList '/S' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw '1.3.12 baseline install failed' }
            Get-Process SYTER -ErrorAction SilentlyContinue | Stop-Process -Force
            New-Item "$env:APPDATA/syter-desktop" -ItemType Directory -Force | Out-Null
            'preserve-v1313-transition' | Set-Content "$env:APPDATA/syter-desktop/v1313-sentinel.txt"
            node update-test/package-1313.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Transition pack preparation failed' }
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./update-test-pack/Test-Update.ps1 -Automation
            if ($LASTEXITCODE -ne 0) { throw 'Real installed 1.3.12 -> 1.3.13 update failed' }
            if ((Get-Content "$env:APPDATA/syter-desktop/v1313-sentinel.txt" -Raw).Trim() -ne 'preserve-v1313-transition') { throw 'Profile sentinel lost' }
            if (Test-Path update-test-pack/test-session.json) { throw 'Temporary feed was not restored' }
            'PASS: real installed 1.3.12 -> 1.3.13, consent/download/restart and profile preservation; loopback feed, not public delivery' | Set-Content test-artifacts/v1313-transition.txt
            Get-Process SYTER -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Save branded installer and update previews
        # Optional diagnostic PNG export; native test failures and final EXE export remain blocking.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-lifecycle-inspection
          path: |
            desktop/test-artifacts/lifecycle-*.png
            desktop/test-artifacts/local-update-*
            desktop/test-artifacts/v1313-transition.txt
            desktop/update-test-pack/requests.log
            desktop/test-artifacts/branded-exe-*.png
            desktop/test-artifacts/installer-progress.json
            desktop/test-artifacts/native-installer-*.png
            desktop/test-artifacts/native-installer-performance.json
            desktop/test-artifacts/native-installer-accessibility.json
            desktop/test-artifacts/native-installer-ui-test*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify release mode and optional publisher signatures
        if: ${{ !inputs.check_only && !inputs.reuse_verified_update }}
        env:
          SYTER_PUBLISHER_NAME: ${{ vars.SYTER_PUBLISHER_NAME }}
          SYTER_SIGNED_RELEASE: ${{ inputs.signed_release }}
        run: |
          ./scripts/verify-release-signatures.ps1
          node scripts/verify-update-artifacts.js
          if ($LASTEXITCODE -ne 0) { throw 'Updater integrity verification failed' }
      - name: Save verified installer
        if: ${{ !inputs.check_only }}
        uses: actions/github-script@v8
        with:
          script: |
            const {persistPrivate}=require('./scripts/persist-private-ci.cjs');
            const result=await persistPrivate({github,context,kind:'windows'});
            await core.summary.addHeading('Verified Windows installer export').addLink('Private byte-verified build and evidence',result.url).write();
      - name: Publish verified GitHub updater assets
        if: ${{ inputs.publish && !inputs.check_only && !inputs.notes_only && !inputs.installer_only && !inputs.reuse_verified_update && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.SYTER_RELEASE_TOKEN }}
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/release/1.3.0' -and '${{ github.ref }}' -ne 'refs/heads/main') { throw 'Publish only approved release branch or main' }
          if (!$env:GH_TOKEN) { throw 'SYTER_RELEASE_TOKEN is required for publishing to syter-releases' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $repo = 'mishakozlov723-wq/syter-releases'
          $tag = "v$version"
          $points = @(Get-Content release-notes.json -Raw -Encoding utf8 | ConvertFrom-Json)
          if ($points.Count -lt 1 -or $points.Count -gt 3) { throw 'Use 1–3 short Russian release-note points' }
          foreach ($point in $points) {
            if ($point -isnot [string] -or $point.Length -gt 110 -or $point -match '[\r\n]' -or $point -notmatch '[А-Яа-яЁё]') { throw 'Each release-note point must be short and in Russian' }
          }
          $notes = ($points | ForEach-Object { '- ' + $_ }) -join "`n"
          # Never overwrite a PUBLIC version. An interrupted upload may have
          # left our own unpublished draft; only that known draft may resume.
          $existingText = gh release view $tag --repo $repo --json isDraft,name,body 2>$null
          $resumeDraft = $false
          if ($LASTEXITCODE -eq 0) {
            $existing = ($existingText -join "`n") | ConvertFrom-Json
            if (!$existing.isDraft) { throw "Public release $tag already exists" }
            if ($existing.name -ne "SYTER $version" -or
                $existing.body.Trim().Replace("`r`n", "`n") -ne $notes.Trim()) {
              throw "Unrecognized draft $tag; do not overwrite"
            }
            $resumeDraft = $true
          }
          $notes | Set-Content release-notes.md -Encoding utf8
          # Preserve existing GitHub feed; SHA512 is integrity, not independent signing.
          $signed = '${{ inputs.signed_release }}' -eq 'true'
          $expected = @("SYTER-Install-$version.exe", "installer-manifest.json", "latest.yml", "SYTER-Setup-$version.exe", "SYTER-Setup-$version.exe.blockmap")
          $assets = @($expected | ForEach-Object {
            $file = Join-Path release $_
            if (!(Test-Path $file -PathType Leaf)) { throw "Missing updater asset: $_" }
            (Resolve-Path $file).Path
          })
          if ($resumeDraft) {
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not finish the unpublished draft assets' }
          } else {
            gh release create $tag @assets --repo $repo --title "SYTER $version" --notes-file release-notes.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create complete draft release' }
          }
          # A resumed draft may contain updater artifacts from a different mode.
          $draftAssets = gh release view $tag --repo $repo --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect draft artifact set' }
          foreach ($asset in $draftAssets) { if ($asset -notin $expected) { throw "Unexpected draft asset $asset; refusing to publish a mixed-mode release" } }
          # Read the draft bytes back BEFORE making a public update discoverable.
          $draftReadback = Join-Path $PWD 'verified-draft-readback'
          New-Item $draftReadback -ItemType Directory -Force | Out-Null
          gh release download $tag --repo $repo --dir $draftReadback
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the unpublished draft for integrity verification' }
          foreach ($name in $expected) {
            $original = Get-FileHash (Join-Path release $name) -Algorithm SHA256
            $remote = Get-FileHash (Join-Path $draftReadback $name) -Algorithm SHA256
            if ($original.Hash -cne $remote.Hash) { throw "Draft bytes differ from verified build: $name" }
          }
          $latestFlag = '--latest'
          gh release edit $tag --repo $repo --notes-file release-notes.md --draft=false $latestFlag
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload succeeded but publishing failed' }
          # Verify actual public delivery, not just a successful upload response.
          $publicReadback = Join-Path $PWD 'verified-public-readback'
          New-Item $publicReadback -ItemType Directory -Force | Out-Null
          gh release download $tag --repo $repo --dir $publicReadback
          if ($LASTEXITCODE -ne 0) { throw 'Published release exists but public readback failed; do not overwrite or delete it' }
          $proof = @()
          foreach ($name in $expected) {
            $original = Get-FileHash (Join-Path release $name) -Algorithm SHA256
            $remoteFile = Join-Path $publicReadback $name
            $remote = Get-FileHash $remoteFile -Algorithm SHA256
            if ($original.Hash -cne $remote.Hash) { throw "Published asset differs from tested bytes: $name; do not overwrite a public version" }
            $proof += @{name=$name;size=(Get-Item $remoteFile).Length;sha256=$remote.Hash.ToLower()}
          }
          $published = gh release view $tag --repo $repo --json isDraft,isPrerelease,tagName,url,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.isPrerelease -or $published.tagName -ne $tag -or $published.assets.Count -ne $expected.Count) { throw 'Published release metadata or complete asset set mismatch' }
          $receipt = @{version=$version;sourceSha=$env:GITHUB_SHA;url=$published.url;assets=$proof}
          'PUBLIC_RELEASE_VERIFIED_JSON=' + ($receipt | ConvertTo-Json -Depth 6 -Compress)
          $receipt | ConvertTo-Json -Depth 6 | Set-Content test-artifacts/published-release.json -Encoding utf8
          "## Public release verified: $($published.url)`nSource: $env:GITHUB_SHA`nAll five public asset SHA256 values match the tested and privately exported files." >> $env:GITHUB_STEP_SUMMARY
