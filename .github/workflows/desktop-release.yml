name: Verify and build SYTER desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer to syter-releases
        type: boolean
        default: false
      check_only:
        description: Run regression and native transition checks without building an installer
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: syter-desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked desktop dependencies and Electron runtime
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          # Newer Electron packages download their binary on first require,
          # rather than during npm ci. Resolve it before native test paths.
          node -e "console.log('Electron executable:', require('electron'))"
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime installation failed' }
      - name: Prepare native icon resources
        run: ./scripts/prepare-build-assets.ps1
      - name: Run regression tests
        run: npm test
      - name: Verify resize animation continuity and draft preservation
        run: |
          $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
          $script = (Resolve-Path ./tests/resize-performance.native.cjs).Path
          $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput resize-test.log -RedirectStandardError resize-test-error.log
          Get-Content resize-test.log
          Get-Content resize-test-error.log
          if ($test.ExitCode -ne 0) { throw "Live resize test failed: $($test.ExitCode)" }
      - name: Verify actual Windows app and global shortcut
        run: |
          $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
          $script = (Resolve-Path ./tests/user-release.native.cjs).Path
          $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput native-test.log -RedirectStandardError native-test-error.log
          Get-Content native-test.log
          Get-Content native-test-error.log
          if ($test.ExitCode -ne 0) { throw "Native Electron test failed: $($test.ExitCode)" }
      - name: Verify branded updater windows and consent
        run: |
          $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
          $script = (Resolve-Path ./tests/lifecycle.native.cjs).Path
          $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput lifecycle-test.log -RedirectStandardError lifecycle-test-error.log
          Get-Content lifecycle-test.log
          Get-Content lifecycle-test-error.log
          if ($test.ExitCode -ne 0) { throw "Lifecycle test failed: $($test.ExitCode)" }
          if (!(Select-String -Path lifecycle-test.log -Pattern "PASS: isolated native lifecycle windows" -Quiet)) { throw "Lifecycle test did not reach completion" }
      - name: Save native transition inspection frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-transition-inspection
          path: desktop/test-artifacts/*
          if-no-files-found: warn
          retention-days: 7
      - name: Build installer and updater files
        if: ${{ !inputs.check_only }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build
      - name: Verify visible generated and packaged icons
        if: ${{ !inputs.check_only }}
        run: |
          $electron = (Resolve-Path ./node_modules/electron/dist/electron.exe).Path
          $script = (Resolve-Path ./tests/icons.native.cjs).Path
          $test = Start-Process -FilePath $electron -ArgumentList "`"$script`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput icon-test.log -RedirectStandardError icon-test-error.log
          Get-Content icon-test.log
          Get-Content icon-test-error.log
          if ($test.ExitCode -ne 0) { throw "Packaged icon test failed: $($test.ExitCode)" }
      - name: Save verified icon previews
        if: ${{ always() && !inputs.check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-icon-inspection
          path: desktop/test-artifacts/*icon*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Download previous test installer for same-runner startup comparison
        if: ${{ !inputs.check_only }}
        uses: actions/download-artifact@v4
        with:
          name: SYTER-windows-release
          run-id: 38718005829
          github-token: ${{ github.token }}
          path: desktop/baseline
      - name: Verify delivered branded installer EXE
        if: ${{ !inputs.check_only }}
        run: |
          ./tests/native-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Native installer verification failed" }
      - name: Save branded installer and update previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-lifecycle-inspection
          path: |
            desktop/test-artifacts/lifecycle-*.png
            desktop/test-artifacts/branded-exe-*.png
            desktop/test-artifacts/installer-progress.json
            desktop/test-artifacts/native-installer-*.png
            desktop/test-artifacts/native-installer-performance.json
            desktop/test-artifacts/native-installer-accessibility.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified installer
        if: ${{ !inputs.check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: SYTER-windows-release
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish all updater assets
        if: ${{ inputs.publish && !inputs.check_only && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.SYTER_RELEASE_TOKEN }}
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/release/1.3.0' -and '${{ github.ref }}' -ne 'refs/heads/main') { throw 'Publish only approved release branch or main' }
          if (!$env:GH_TOKEN) { throw 'SYTER_RELEASE_TOKEN is required for publishing to syter-releases' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $repo = 'mishakozlov723-wq/syter-releases'
          $tag = "v$version"
          # Never overwrite a PUBLIC version. An interrupted upload may have
          # left our own unpublished draft; only that known draft may resume.
          $existingText = gh release view $tag --repo $repo --json isDraft,name,body 2>$null
          $resumeDraft = $false
          if ($LASTEXITCODE -eq 0) {
            $existing = ($existingText -join "`n") | ConvertFrom-Json
            if (!$existing.isDraft) { throw "Public release $tag already exists" }
            if ($existing.name -ne "SYTER $version" -or
                $existing.body -notlike '*SYTER 1.3.0 production desktop release.*' -or
                $existing.body -notlike '*Minimum desktop width protects the full Equity Curve layout.*') {
              throw "Unrecognized draft $tag; do not overwrite"
            }
            $resumeDraft = $true
          }
          @"
          - SYTER 1.3.0 production desktop release.
          - Minimum desktop width protects the full Equity Curve layout.
          - Improved resizing and optimized seasonal animations with hardware acceleration enabled.
          - Clean SYTER title and tray menu; no diagnostic controls.
          - Existing journal data, mini journal and automatic updates preserved.
          "@ | Set-Content release-notes.md
          $expected = @("latest.yml", "SYTER-Setup-$version.exe", "SYTER-Setup-$version.exe.blockmap", "SYTER-Install-$version.exe", "installer-manifest.json")
          $assets = @($expected | ForEach-Object {
            $file = Join-Path release $_
            if (!(Test-Path $file -PathType Leaf)) { throw "Missing updater asset: $_" }
            (Resolve-Path $file).Path
          })
          if ($resumeDraft) {
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not finish the unpublished draft assets' }
          } else {
            gh release create $tag @assets --repo $repo --title "SYTER $version" --notes-file release-notes.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create complete draft release' }
          }
          gh release edit $tag --repo $repo --notes-file release-notes.md --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload succeeded but publishing failed' }
